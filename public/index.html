<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isom Electric — Generator Service Tracker</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #52606d;
    --paper: #f6f7f9;
    --line: #dde2e8;
    --accent: #1f5f5b;
    --accent-soft: #e4efee;
    --danger: #b3261e;
    --danger-soft: #fbe9e7;
    --warn: #8a5a00;
    --warn-soft: #fff2d9;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    background: var(--ink);
    color: white;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; opacity: 0.65; margin-top: 2px; }
  nav {
    display: flex;
    gap: 4px;
    padding: 10px 24px 0;
    background: white;
    border-bottom: 1px solid var(--line);
  }
  nav button {
    border: none;
    background: none;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  #login-screen {
    max-width: 340px;
    margin: 90px auto;
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
  }
  #login-screen h2 { margin-top: 0; font-size: 16px; }
  #login-screen input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin: 12px 0;
    font-size: 14px;
  }
  #login-screen button, .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
  }
  #login-screen button:hover, .btn:hover { opacity: 0.9; }
  #login-error { color: var(--danger); font-size: 13px; min-height: 18px; }

  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { background: #fafbfc; font-weight: 600; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 var(--line); }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #fafbfc; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.clean { background: var(--accent-soft); color: var(--accent); }
  .badge.needs_serial { background: var(--warn-soft); color: var(--warn); }
  .badge.serial_conflict { background: var(--danger-soft); color: var(--danger); }

  .filters { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filters select, .filters input { padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px;
  }
  form.card { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; max-width: 640px; }

  #detail-modal {
    display: none; position: fixed; inset: 0; background: rgba(20,25,32,0.5);
    align-items: center; justify-content: center; z-index: 50;
  }
  #detail-modal.active { display: flex; }
  #detail-modal .box {
    background: white; border-radius: var(--radius); padding: 24px; width: 560px; max-height: 85vh; overflow-y: auto;
  }
  #detail-modal .box h3 { margin-top: 0; }
  #detail-modal .close { float: right; cursor: pointer; color: var(--ink-soft); font-size: 20px; line-height: 1; }
  #status-msg { font-size: 13px; margin-top: 10px; min-height: 16px; }
  #status-msg.error { color: var(--danger); }
  #status-msg.ok { color: var(--accent); }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Generator Service Tracker</h2>
  <input type="password" id="login-token" placeholder="Access code">
  <button onclick="doLogin()">Enter</button>
  <div id="login-error"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <div>
      <h1>Generator Service Tracker</h1>
      <div class="sub">Isom Electric</div>
    </div>
  </header>
  <nav>
    <button class="active" data-panel="list-panel" onclick="switchPanel('list-panel', this)">Generators</button>
    <button data-panel="search-panel" onclick="switchPanel('search-panel', this)">Search</button>
    <button data-panel="add-panel" onclick="switchPanel('add-panel', this)">Add Install</button>
  </nav>

  <main>
    <div id="list-panel" class="panel active">
      <div class="filters">
        <select id="filter-status" onchange="renderList()">
          <option value="">All statuses</option>
          <option value="clean">Clean</option>
          <option value="needs_serial">Needs serial</option>
          <option value="serial_conflict">Serial conflict</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search name, serial, address..." oninput="renderList()">
        <button class="btn" onclick="loadGenerators()">Refresh</button>
        <label style="font-size:13px; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="filter-show-archived" onchange="loadGenerators()">Show archived</label>
      </div>
      <div class="table-wrap">
      <table id="gen-table">
        <thead>
          <tr><th>Flag</th><th>Customer</th><th>Serial #</th><th>Model</th><th>Location</th><th>Install date</th><th>Last service</th></tr>
        </thead>
        <tbody id="gen-tbody"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
      </div>
    </div>

    <div id="search-panel" class="panel">
      <form class="card" id="search-form-el" style="max-width:100%;" onsubmit="return runSearch(event)">
        <div class="field-grid">
          <div class="field"><label>Install date from</label><input type="date" name="install_date_from"></div>
          <div class="field"><label>Install date to</label><input type="date" name="install_date_to"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Last service date from</label><input type="date" name="last_service_from"></div>
          <div class="field"><label>Last service date to</label><input type="date" name="last_service_to"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Customer name contains</label><input name="customer_search" placeholder="last, first, or business name"></div>
          <div class="field"><label>Serial number contains</label><input name="serial_search"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Model contains</label><input name="model"></div>
          <div class="field"><label>Address/city contains</label><input name="location_search"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Review status</label>
            <select name="review_status">
              <option value="">Any</option>
              <option value="clean">Clean</option>
              <option value="needs_serial">Needs serial</option>
              <option value="serial_conflict">Serial conflict</option>
            </select>
          </div>
          <div class="field"><label>Phone on file</label>
            <select name="has_phone">
              <option value="">Any</option>
              <option value="yes">Has a phone number</option>
              <option value="no">Missing phone number</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label><input type="checkbox" name="never_serviced" value="yes" style="width:auto; display:inline-block; margin-right:6px;">Never serviced (no work order on file)</label>
        </div>
        <button type="submit" class="btn">Search</button>
        <button type="button" class="btn" style="background:#52606d" onclick="document.getElementById('search-form-el').reset(); document.getElementById('search-results').innerHTML='';">Clear filters</button>
      </form>
      <div id="search-results" style="margin-top:16px;"></div>
    </div>

    <div id="add-panel" class="panel">
      <form class="card" onsubmit="return submitNewInstall(event)">
        <div class="field-grid">
          <div class="field"><label>First name</label><input name="first_name"></div>
          <div class="field"><label>Last name</label><input name="last_name"></div>
        </div>
        <div class="field"><label>Business name (if applicable)</label><input name="business_name"></div>
        <div class="field"><label>Phone</label><input name="phone" placeholder="864-555-1234"></div>
        <div class="field"><label>Generator location / address</label><input name="location_address"></div>
        <div class="field-grid">
          <div class="field"><label>Install date</label><input type="date" name="install_date"></div>
          <div class="field"><label>Model</label><input name="model"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Generator serial number</label><input name="serial_number"></div>
          <div class="field"><label>ATS serial number</label><input name="ats_serial_number"></div>
        </div>
        <div class="field-grid">
          <div class="field"><label>Oil filter part</label><input name="oil_filter_part"></div>
          <div class="field"><label>Oil capacity</label><input name="oil_capacity"></div>
        </div>
        <button type="submit" class="btn">Save new install</button>
        <div id="add-status" style="margin-top:10px; font-size:13px;"></div>
      </form>
    </div>
  </main>
</div>

<div id="detail-modal">
  <div class="box">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let TOKEN = sessionStorage.getItem('gen_app_token') || '';
let GENERATORS = [];

function apiCall(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-app-token': TOKEN }, opts.headers || {});
  return fetch('/api/' + path, opts).then(async r => {
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}

function doLogin() {
  TOKEN = document.getElementById('login-token').value;
  fetch('/api/generators-list', { headers: { 'x-app-token': TOKEN } }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) {
      document.getElementById('login-error').textContent = 'Incorrect access code.';
      return;
    }
    if (!r.ok) {
      document.getElementById('login-error').textContent = 'Server error: ' + (data.error || ('HTTP ' + r.status));
      return;
    }
    sessionStorage.setItem('gen_app_token', TOKEN);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadGenerators();
  }).catch(err => {
    document.getElementById('login-error').textContent = 'Network error: ' + err.message;
  });
}

if (TOKEN) {
  apiCall('generators-list').then(data => {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    GENERATORS = data.generators;
    renderList();
  }).catch(() => { sessionStorage.removeItem('gen_app_token'); });
}

function switchPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function loadGenerators() {
  document.getElementById('gen-tbody').innerHTML = '<tr><td colspan="7">Loading...</td></tr>';
  const showArchived = document.getElementById('filter-show-archived') && document.getElementById('filter-show-archived').checked;
  const suffix = showArchived ? '?include_archived=yes' : '';
  apiCall('generators-list' + suffix).then(data => {
    GENERATORS = data.generators;
    renderList();
  }).catch(err => {
    document.getElementById('gen-tbody').innerHTML = `<tr><td colspan="7">Error: ${escapeHtml(err.message)}</td></tr>`;
  });
}

function badgeLabel(status) {
  if (status === 'needs_serial') return 'Needs serial';
  if (status === 'serial_conflict') return 'Serial conflict';
  return 'Clean';
}

// Distinct colors cycled per conflict group so multiple simultaneous
// conflicts are visually distinguishable from each other, not just
// flagged red as a category.
const CONFLICT_COLORS = ['#fcebea', '#fdf3d8', '#e8f0fc', '#eee7fb', '#e3f6ee', '#fbe8f2'];
const CONFLICT_BORDER_COLORS = ['#d9534f', '#c9a227', '#4a7fd1', '#8562c4', '#3f9e79', '#c94f8c'];
const conflictColorMap = {};
function colorForConflictGroup(groupId) {
  if (!groupId) return null;
  if (!(groupId in conflictColorMap)) {
    const idx = Object.keys(conflictColorMap).length % CONFLICT_COLORS.length;
    conflictColorMap[groupId] = { bg: CONFLICT_COLORS[idx], border: CONFLICT_BORDER_COLORS[idx] };
  }
  return conflictColorMap[groupId];
}

function renderList() {
  const statusFilter = document.getElementById('filter-status').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  let rows = GENERATORS.filter(g => {
    if (statusFilter && g.review_status !== statusFilter) return false;
    if (search) {
      const hay = [g.first_name, g.last_name, g.business_name, g.serial_number, g.location_address].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // sort so rows sharing a conflict_group_id land next to each other,
  // while still keeping flagged rows near the top overall
  rows = rows.slice().sort((a, b) => {
    const prio = (b.review_priority || '').localeCompare(a.review_priority || '');
    if (prio !== 0) return prio;
    const groupA = a.conflict_group_id || '';
    const groupB = b.conflict_group_id || '';
    if (groupA !== groupB) return groupA.localeCompare(groupB);
    return (b.install_date || '').localeCompare(a.install_date || '');
  });

  const tbody = document.getElementById('gen-tbody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7">No generators match.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(g => {
    const customerName = g.business_name || `${g.first_name || ''} ${g.last_name || ''}`.trim() || '(unknown)';
    const conflictColor = colorForConflictGroup(g.conflict_group_id);
    let rowStyle = conflictColor ? ` style="background:${conflictColor.bg}; border-left:4px solid ${conflictColor.border};"` : '';
    if (g.archived) rowStyle = ' style="opacity:0.5; font-style:italic;"';
    return `<tr class="clickable"${rowStyle} onclick="openDetail('${g.id}')">
      <td><span class="badge ${g.review_status}">${badgeLabel(g.review_status)}</span>${g.archived ? ' <span class="badge" style="background:#e2e5e9;color:#52606d;">Archived</span>' : ''}</td>
      <td>${escapeHtml(customerName)}</td>
      <td>${escapeHtml(g.serial_number || '—')}</td>
      <td>${escapeHtml(g.model || '—')}</td>
      <td>${escapeHtml(g.location_address || '—')}</td>
      <td>${g.install_date || '—'}</td>
      <td>${g.last_service_date || '—'}</td>
    </tr>`;
  }).join('');
}

function openDetail(id) {
  const g = GENERATORS.find(x => x.id === id);
  if (!g) return;
  const customerName = g.business_name || `${g.first_name || ''} ${g.last_name || ''}`.trim() || '(unknown)';
  const v = (val) => val === null || val === undefined ? '' : val;

  document.getElementById('modal-body').innerHTML = `
    <h3>${escapeHtml(customerName)}</h3>
    <p><span class="badge ${g.review_status}">${badgeLabel(g.review_status)}</span>${g.archived ? ' <span class="badge" style="background:#e2e5e9;color:#52606d;">Archived</span>' : ''}</p>

    <h4>Customer</h4>
    <div class="field-grid">
      <div class="field"><label>First name</label><input id="edit-first_name" value="${escapeHtml(v(g.first_name))}"></div>
      <div class="field"><label>Last name</label><input id="edit-last_name" value="${escapeHtml(v(g.last_name))}"></div>
    </div>
    <div class="field"><label>Business name</label><input id="edit-business_name" value="${escapeHtml(v(g.business_name))}"></div>
    <div class="field-grid">
      <div class="field"><label>Phone</label><input id="edit-phone" value="${escapeHtml(v(g.phone))}"></div>
      <div class="field"><label>City</label><input id="edit-city" value="${escapeHtml(v(g.city))}"></div>
    </div>
    <div class="field"><label>Generator location / address</label><input id="edit-address" value="${escapeHtml(v(g.location_address))}"></div>

    <h4>Generator</h4>
    <div class="field-grid">
      <div class="field"><label>Serial number</label><input id="edit-serial_number" value="${escapeHtml(v(g.serial_number))}"></div>
      <div class="field"><label>ATS serial number</label><input id="edit-ats_serial_number" value="${escapeHtml(v(g.ats_serial_number))}"></div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Model</label><input id="edit-model" value="${escapeHtml(v(g.model))}"></div>
      <div class="field"><label>Install date</label><input type="date" id="edit-install_date" value="${escapeHtml(v(g.install_date))}"></div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Oil filter part</label><input id="edit-oil_filter_part" value="${escapeHtml(v(g.oil_filter_part))}"></div>
      <div class="field"><label>Oil capacity</label><input id="edit-oil_capacity" value="${escapeHtml(v(g.oil_capacity))}"></div>
    </div>
    <div class="field"><label>Run hours</label><input type="number" id="edit-run_hours" value="${escapeHtml(v(g.run_hours))}"></div>

    <button class="btn" onclick="saveProfile('${g.id}', '${g.customer_id || ''}', '${g.job_location_id || ''}')">Save profile</button>
    <div id="profile-save-status" style="margin-top:8px; font-size:13px;"></div>

    <p style="margin-top:14px;"><b>Last service:</b> ${g.last_service_date || 'Never recorded'}</p>
    ${g.review_notes ? `<p><b>Review notes:</b> ${escapeHtml(g.review_notes)}</p>` : ''}

    <hr>
    <h4>Log a service work order</h4>
    <div class="field"><label>Service date</label><input type="date" id="wo-date"></div>
    <div class="field"><label>Technician</label><input id="wo-tech"></div>
    <div class="field"><label>Run hours at service</label><input type="number" id="wo-hours"></div>
    <div class="field"><label>Notes</label><textarea id="wo-notes" rows="2"></textarea></div>
    <button class="btn" onclick="logWorkOrder('${g.id}')">Save work order</button>

    ${g.review_status !== 'clean' ? `
    <hr>
    <h4>Resolve flag</h4>
    <div class="field"><label>Correct serial number (if fixing a data error)</label><input id="fix-serial" value="${escapeHtml(g.serial_number || '')}"></div>
    <div class="field"><label>Review note (explain what you found)</label><textarea id="fix-notes" rows="2"></textarea></div>
    <button class="btn" onclick="resolveFlag('${g.id}', true)">Mark resolved</button>
    <button class="btn" style="background:#52606d" onclick="resolveFlag('${g.id}', false)">Save note only, keep flagged</button>
    ` : ''}

    <hr>
    <h4>Archive or delete this record</h4>
    <p style="font-size:12px; color:#52606d;">Archiving hides it from the active list but keeps everything (safe, reversible). Deleting is permanent and removes its service history too, use this only for a confirmed duplicate.</p>
    ${g.archived
      ? `<button class="btn" onclick="archiveGenerator('${g.id}', false)">Restore from archive</button>`
      : `<div class="field"><label>Reason (optional)</label><input id="archive-reason"></div>
         <button class="btn" style="background:#8a5a00" onclick="archiveGenerator('${g.id}', true)">Archive</button>`
    }
    <button class="btn" style="background:#b3261e" onclick="deleteGenerator('${g.id}')">Delete permanently</button>
    <div id="status-msg"></div>
  `;
  document.getElementById('detail-modal').classList.add('active');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('active'); }

function logWorkOrder(generatorId) {
  const payload = {
    generator_id: generatorId,
    service_date: document.getElementById('wo-date').value,
    technician: document.getElementById('wo-tech').value,
    run_hours_at_service: document.getElementById('wo-hours').value || null,
    notes: document.getElementById('wo-notes').value,
  };
  if (!payload.service_date) {
    setStatus('Service date is required.', true);
    return;
  }
  apiCall('work-orders-create', { method: 'POST', body: JSON.stringify(payload) })
    .then(() => { setStatus('Work order saved.', false); loadGenerators(); })
    .catch(err => setStatus(err.message, true));
}

function saveProfile(generatorId, customerId, jobLocationId) {
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const payload = {
    generator_id: generatorId,
    customer_id: customerId || null,
    job_location_id: jobLocationId || null,
    generator_updates: {
      serial_number: val('edit-serial_number'),
      ats_serial_number: val('edit-ats_serial_number'),
      model: val('edit-model'),
      install_date: val('edit-install_date'),
      oil_filter_part: val('edit-oil_filter_part'),
      oil_capacity: val('edit-oil_capacity'),
      run_hours: val('edit-run_hours'),
    },
    customer_updates: {
      first_name: val('edit-first_name'),
      last_name: val('edit-last_name'),
      business_name: val('edit-business_name'),
      phone: val('edit-phone'),
      city: val('edit-city'),
    },
    location_updates: {
      address: val('edit-address'),
    },
  };

  const statusEl = document.getElementById('profile-save-status');
  statusEl.textContent = 'Saving...';
  apiCall('profile-update', { method: 'PATCH', body: JSON.stringify(payload) })
    .then(() => {
      statusEl.textContent = 'Saved.';
      statusEl.style.color = '#1f5f5b';
      loadGenerators();
    })
    .catch(err => {
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.style.color = '#b3261e';
    });
}

function archiveGenerator(generatorId, archive) {
  const reasonEl = document.getElementById('archive-reason');
  const payload = { generator_id: generatorId, archive, reason: reasonEl ? reasonEl.value : undefined };
  apiCall('generators-archive', { method: 'PATCH', body: JSON.stringify(payload) })
    .then(() => { setStatus(archive ? 'Archived.' : 'Restored.', false); loadGenerators(); closeModal(); })
    .catch(err => setStatus(err.message, true));
}

function deleteGenerator(generatorId) {
  const sure = confirm('This permanently deletes this generator and its service history. This cannot be undone. Are you sure?');
  if (!sure) return;
  apiCall('generators-delete', { method: 'POST', body: JSON.stringify({ generator_id: generatorId, confirm: true }) })
    .then(() => { setStatus('Deleted.', false); loadGenerators(); closeModal(); })
    .catch(err => setStatus(err.message, true));
}

function resolveFlag(generatorId, markResolved) {
  const payload = {
    generator_id: generatorId,
    updates: { serial_number: document.getElementById('fix-serial').value },
    review_notes: document.getElementById('fix-notes').value,
    mark_resolved: markResolved,
  };
  apiCall('generators-resolve', { method: 'PATCH', body: JSON.stringify(payload) })
    .then(() => { setStatus('Saved.', false); loadGenerators(); closeModal(); })
    .catch(err => setStatus(err.message, true));
}

function setStatus(msg, isError) {
  const el = document.getElementById('status-msg');
  if (!el) return;
  el.textContent = msg;
  el.className = isError ? 'error' : 'ok';
}

function submitNewInstall(evt) {
  evt.preventDefault();
  const form = evt.target;
  const payload = Object.fromEntries(new FormData(form).entries());
  apiCall('generators-create', { method: 'POST', body: JSON.stringify(payload) })
    .then(() => {
      document.getElementById('add-status').textContent = 'Saved.';
      form.reset();
      loadGenerators();
    })
    .catch(err => { document.getElementById('add-status').textContent = 'Error: ' + err.message; });
  return false;
}

function runSearch(evt) {
  evt.preventDefault();
  const form = evt.target;
  const params = new URLSearchParams();
  new FormData(form).forEach((value, key) => {
    if (value) params.set(key, value);
  });

  const resultsEl = document.getElementById('search-results');
  resultsEl.innerHTML = 'Searching...';

  fetch('/api/generators-search?' + params.toString(), { headers: { 'x-app-token': TOKEN } })
    .then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Search failed');
      renderSearchResults(data.results);
    })
    .catch(err => { resultsEl.innerHTML = 'Error: ' + escapeHtml(err.message); });

  return false;
}

function renderSearchResults(results) {
  const resultsEl = document.getElementById('search-results');
  if (!results.length) {
    resultsEl.innerHTML = '<p>No generators match those filters.</p>';
    return;
  }
  resultsEl.innerHTML = `<p>${results.length} result${results.length === 1 ? '' : 's'}</p>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Flag</th><th>Customer</th><th>Serial #</th><th>Model</th><th>Address</th><th>Install date</th><th>Last service</th><th>Phone</th></tr></thead>
      <tbody>
        ${results.map(g => {
          const customerName = g.business_name || `${g.first_name || ''} ${g.last_name || ''}`.trim() || '(unknown)';
          return `<tr>
            <td><span class="badge ${g.review_status}">${badgeLabel(g.review_status)}</span></td>
            <td>${escapeHtml(customerName)}</td>
            <td>${escapeHtml(g.serial_number || '—')}</td>
            <td>${escapeHtml(g.model || '—')}</td>
            <td>${escapeHtml(g.location_address || '—')}</td>
            <td>${g.install_date || '—'}</td>
            <td>${g.last_service_date || '—'}</td>
            <td>${escapeHtml(g.phone || '—')}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
